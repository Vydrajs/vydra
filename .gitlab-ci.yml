stages:
  - build
  - publish

build:
  stage: build
  tags:
    - shell
  script:
    - npm install
    - npm run build
  only:
    - main
    - beta

publish-beta:
  stage: publish
  tags:
    - shell
  only:
    - beta
  script:
    - |
      $ErrorActionPreference = "Stop"

      $gitlabUrl = "gitlab.local"
      $projectId = $env:CI_PROJECT_ID
      $token = $env:CI_JOB_TOKEN

      $registry = "http://$gitlabUrl/api/v4/projects/$projectId/packages/npm/"
      $authUrl = "//$gitlabUrl/api/v4/projects/$projectId/packages/npm/"

      $npmrcContent = @"
      @vydra-js:registry=$registry
      ${authUrl}:_authToken=$token
      "@

      $npmrcContent | Set-Content -Path ".npmrc" -Encoding Ascii

      try {
        npm install
        npm run build

        # ❌ NO pongas pre enter aquí
        npx changeset version

        # ✅ sin --registry
        npx changeset publish --tag beta

      } finally {
        Remove-Item -Force ".npmrc" -ErrorAction SilentlyContinue
      }

publish-latest:
  stage: publish
  tags:
    - shell
  when: manual
  only:
    - main
  script:
    - |
      $ErrorActionPreference = "Stop"

      $gitlabUrl = "gitlab.local"
      $projectId = $env:CI_PROJECT_ID
      $token = $env:CI_JOB_TOKEN

      $registry = "http://$gitlabUrl/api/v4/projects/$projectId/packages/npm/"
      $authUrl = "//$gitlabUrl/api/v4/projects/$projectId/packages/npm/"

      $npmrcContent = @"
      @vydra-js:registry=$registry
      ${authUrl}:_authToken=$token
      "@

      $npmrcContent | Set-Content -Path ".npmrc" -Encoding Ascii

      try {
        npm ci
        npm run build

        # 🔥 versionado automático
        npx changeset version

        # 🔥 publish estable
        npx changeset publish --registry $registry

      } finally {
        Remove-Item -Force ".npmrc" -ErrorAction SilentlyContinue
      }
